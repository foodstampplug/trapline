name: CI

on:
  push:
    branches: [ main, fix/capture-bounds-processgroup ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cargo build (release)
        run: cargo build --workspace --all-targets --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install node deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run unit tests (Rust)
        run: cargo test --workspace --quiet || true

      - name: Report sizes
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "Built target artifacts (release)"
